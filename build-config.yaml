# Zulu Tomcat Docker Build Configuration

# Tomcat versions
# The jdk list holds every Zulu JDK major version an image is built for.
# Zulu patch levels come from the "<major>-latest" base image tags, so they update automatically.
tomcat:
  "9.0":
    version: "9.0.120"
    url: "https://dlcdn.apache.org/tomcat/tomcat-9/v9.0.120/bin/apache-tomcat-9.0.120"
    # Tomcat 9.0 requires Java 8 or later
    jdk: ["8", "17", "21", "25"]
  "10.1":
    version: "10.1.57"
    url: "https://dlcdn.apache.org/tomcat/tomcat-10/v10.1.57/bin/apache-tomcat-10.1.57"
    # Tomcat 10.1 requires Java 11 or later
    jdk: ["17", "21", "25"]
  "11.0":
    version: "11.0.24"
    url: "https://dlcdn.apache.org/tomcat/tomcat-11/v11.0.24/bin/apache-tomcat-11.0.24"
    # Tomcat 11.0 requires Java 17 or later
    jdk: ["17", "21", "25"]

# OS/Distribution configurations
distributions:
  alpine:
    base_image: "azul/zulu-openjdk-alpine"
    package_manager:
      install: "apk add --no-cache"
      remove: "apk del"
      cleanup: ""
    download_tool: "wget"
    download_flags: "-q -O"
    archive_ext: ".tar.gz"
    extract_cmd: "tar -xf tomcat.tar.gz -C \"$CATALINA_HOME\" --strip-components=1"
    cleanup_cmd: "rm tomcat.tar.gz"
    shell: "/bin/sh"
    path_format: "unix"
    run_cmd: "catalina.sh"

  debian:
    base_image: "azul/zulu-openjdk-debian"
    package_manager:
      install: "apt-get -qq update \\&\\& apt-get -qq -y --no-install-recommends install"
      remove: "apt-get -qq -y purge"
      cleanup: "apt-get -qq -y autoremove \\&\\& rm -rf /var/lib/apt/lists/*"
    download_tool: "wget"
    download_flags: "-q -O"
    archive_ext: ".tar.gz"
    extract_cmd: "tar -xf tomcat.tar.gz -C \"$CATALINA_HOME\" --strip-components=1"
    cleanup_cmd: "rm tomcat.tar.gz"
    shell: "/bin/sh"
    path_format: "unix"
    run_cmd: "catalina.sh"

  ubuntu:
    base_image: "azul/zulu-openjdk"
    package_manager:
      install: "apt-get -qq update \\&\\& apt-get -qq -y --no-install-recommends install"
      remove: "apt-get -qq -y purge"
      cleanup: "apt-get -qq -y autoremove \\&\\& rm -rf /var/lib/apt/lists/*"
    download_tool: "wget"
    download_flags: "-q -O"
    archive_ext: ".tar.gz"
    extract_cmd: "tar -xf tomcat.tar.gz -C \"$CATALINA_HOME\" --strip-components=1"
    cleanup_cmd: "rm tomcat.tar.gz"
    shell: "/bin/sh"
    path_format: "unix"
    run_cmd: "catalina.sh"

  distroless:
    multi_stage: true
    builder_image: "azul/zulu-openjdk-debian"
    base_image: "azul/zulu-openjdk-distroless"
    package_manager:
      install: "apt-get -qq update \\&\\& apt-get -qq -y --no-install-recommends install"
    download_tool: "wget"
    download_flags: "-q -O"
    archive_ext: ".tar.gz"
    extract_cmd: "tar -xf tomcat.tar.gz -C \"$CATALINA_HOME\" --strip-components=1"
    cleanup_cmd: "rm tomcat.tar.gz"
    shell: "/bin/sh"
    path_format: "unix"
    use_entrypoint: true
    # azul/zulu-openjdk-distroless only publishes 17 and 21 tags
    excluded_jdk_versions: ["8", "25"]
    entrypoint: |
      ["java", \
          "-Dcatalina.home=/usr/local/tomcat", \
          "-Djava.security.egd=file:/dev/urandom", \
          "-classpath", "/usr/local/tomcat/bin/bootstrap.jar:/usr/local/tomcat/bin/tomcat-juli.jar:/usr/local/tomcat/bin/commons-daemon.jar:/usr/local/tomcat/lib/*", \
          "org.apache.catalina.startup.Bootstrap", \
          "start"]
